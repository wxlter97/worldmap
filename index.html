<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F4F3EF" />
    <meta name="description" content="Mapa personal de viajes: países, ciudades y lugares visitados." />
    <title>Mapa · wxlter.</title>
    <script>
      // Aplica el tema antes de pintar para evitar un destello claro en modo oscuro.
      try {
        var t = localStorage.getItem('wm:theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
